[package]
name = "ja-core"
version = "0.1.0"
edition = "2021"
description = "Junior Astronaut: Outpost — game rules for the 2D game (no rendering, no Bevy)"
license = "MIT"

[features]
default = ["live"]
# live NASA DONKI download over HTTPS (needs a C compiler for TLS on Windows: VS Build Tools)
live = ["dep:ureq"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "2.10", optional = true }
